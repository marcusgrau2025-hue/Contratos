<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f2f5; }

header {
  background: #1a1a2e;
  color: white;
  padding: 20px 24px;
}
header h1 { font-size: 20px; }
header p { font-size: 13px; color: #aaa; margin-top: 4px; }

.search-box {
  background: white;
  padding: 20px 24px;
  border-bottom: 2px solid #e2e8f0;
  position: sticky;
  top: 0;
  z-index: 999;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.search-box input {
  width: 100%;
  max-width: 600px;
  padding: 14px 18px;
  font-size: 16px;
  border: 2px solid #ccc;
  border-radius: 8px;
  outline: none;
}
.search-box input:focus { border-color: #1a1a2e; }

.search-box button {
  margin-left: 10px;
  padding: 14px 20px;
  background: #1a1a2e;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
}
.search-box button:hover { background: #2d3748; }

#status {
  margin-top: 12px;
  font-size: 14px;
  color: #555;
  font-weight: bold;
}

.container { padding: 24px; }

.resultado-card {
  background: white;
  border-radius: 10px;
  margin-bottom: 14px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  border-left: 5px solid #1a1a2e;
}

.resultado-card .topo {
  background: #1a1a2e;
  color: white;
  padding: 10px 18px;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 0.3px;
}

.resultado-card .corpo {
  padding: 14px 18px;
}

.resultado-card .linha {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #f0f2f5;
  font-size: 15px;
}
.resultado-card .linha:last-child { border-bottom: none; }

.resultado-card .nome { color: #1a1a2e; font-weight: 600; }
.resultado-card .contrato {
  font-family: monospace;
  font-size: 14px;
  color: #555;
}
.resultado-card .prateleira {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
}

.nao-encontrado {
  text-align: center;
  padding: 60px;
  color: #999;
  display: none;
}
.nao-encontrado p { font-size: 18px; margin-top: 10px; }

mark { background: #fef08a; padding: 1px 3px; border-radius: 3px; }
.novo-badge {
  background: #22c55e;
  color: white;
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 10px;
  margin-left: 8px;
  vertical-align: middle;
}
</style>
</head>
<body>

<header>
  <h1>🗂️ Contratos Habitacionais</h1>
  <p>Digite um nome ou número de contrato para buscar</p>
</header>

<div class="search-box">
  <input type="text" id="input-busca" placeholder="Ex: João Silva  ou  1.4444.0005786-0" />
  <button onclick="buscar()">Buscar</button>
  <button onclick="limpar()" style="background:#888;">Limpar</button>
  <div id="status"></div>

function normalizar(str) {
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
}

function highlight(texto, termo) {
  if (!termo) return texto;
  var re = new RegExp('(' + termo.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return texto.replace(re, '<mark>$1</mark>');
}

function buscar() {
  var termo = document.getElementById('input-busca').value.trim();
  var termoNorm = normalizar(termo);
  var termoSemPontos = termo.replace(/[.\-]/g,'').toLowerCase();

  var resultados = document.getElementById('resultados');
  var naoEncontrado = document.getElementById('nao-encontrado');
  var status = document.getElementById('status');

  if (!termo) {
    resultados.innerHTML = '';
    naoEncontrado.style.display = 'none';
    status.innerHTML = '';
    return;
  }

  var encontrados = registros.filter(function(r) {
    var nomeNorm = normalizar(r.nome);
    var contratoSemPontos = r.contrato.replace(/[.\-]/g,'').toLowerCase();
    return nomeNorm.includes(termoNorm) || contratoSemPontos.includes(termoSemPontos);
  });

  if (encontrados.length === 0) {
    resultados.innerHTML = '';
    naoEncontrado.style.display = 'block';
    status.innerHTML = '❌ Nenhum resultado para: <strong>' + termo + '</strong>';
    return;
  }

  naoEncontrado.style.display = 'none';
  status.innerHTML = '✅ ' + encontrados.length + ' resultado(s) encontrado(s) para: <strong>' + termo + '</strong>';

  var html = '';
  encontrados.forEach(function(r) {
    html += '<div class="resultado-card">'
      + '<div class="topo">📦 ' + r.caixa + ' &nbsp;|&nbsp; 🗄️ ' + r.prateleira + '</div>'
      + '<div class="corpo">'
      + '<div class="linha">'
      + '<span class="nome">' + highlight(r.nome, termo) + (r.novo ? '<span class="novo-badge">NOVO</span>' : '') + '</span>'
      + '<span class="contrato">' + highlight(r.contrato, termo) + '</span>'
      + '</div>'
      + '</div></div>';
  });

  resultados.innerHTML = html;
}

function limpar() {
  document.getElementById('input-busca').value = '';
  document.getElementById('resultados').innerHTML = '';
  document.getElementById('nao-encontrado').style.display = 'none';
  document.getElementById('status').innerHTML = '';
  document.getElementById('input-busca').focus();
}

document.getElementById('input-busca').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') buscar();
});
